<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Job Match Analyzer | StartBusinessAI</title><meta name="description" content="Compare your career profile with a job description and see strengths, missing skills, and whether you should apply."><link rel="icon" href="/assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/career-platform.css"><link rel="stylesheet" href="/assets/career-product.css"><script defer src="/assets/career-platform.js"></script></head><body class="career-site"><nav class="career-nav"><a class="career-logo" href="/"><img src="/assets/career-logo.svg" alt="StartBusinessAI"></a><button class="career-menu" aria-expanded="false" aria-label="Open navigation">Menu</button><div class="career-links"><a href="/">Home</a><a href="/careers">Careers</a><a href="/jobs">Jobs</a><a href="/job-match" aria-current="page">Job Match</a><a href="/roadmap">My Roadmap</a><a class="nav-cta" href="/career-finder">Career Finder</a></div></nav><main class="finder-wrap"><div class="shell"><header class="finder-header"><span class="kicker">AI Job Matcher</span><h1>Know your fit before you apply</h1><p>Paste a job description. We’ll compare it with the skills saved by your Career Finder and explain the score.</p></header><section class="finder-card"><form id="job-match-form"><label class="field-label" for="job-title">Job title</label><input class="text-field" id="job-title" placeholder="e.g. Digital Marketing Specialist"><label class="field-label" for="job-description">Job description</label><textarea class="text-field job-text" id="job-description" rows="10" placeholder="Paste the responsibilities and requirements here…" required></textarea><div class="hero-actions"><button class="button" type="submit">Analyze My Match →</button><a class="button secondary" href="/career-finder">Update My Profile</a></div></form><section class="results" id="job-results" aria-live="polite"></section></section></div></main><script>
document.getElementById('job-match-form').addEventListener('submit',function(e){e.preventDefault();var text=document.getElementById('job-description').value.toLowerCase(),title=document.getElementById('job-title').value||'This role',profile=JSON.parse(localStorage.getItem('careerProfile')||'{"skills":[]}'),known=(profile.skills||[]),terms=['writing','design','marketing','research','analytics','data','communication','sales','video','technology','ai','project management','social media','content creation','excel','organization','customer service','problem solving'],required=terms.filter(function(x){return text.includes(x)}),have=required.filter(function(x){return known.includes(x)||(x==='data'&&known.includes('analytics'))||(x==='ai'&&known.includes('technology'))}),missing=required.filter(function(x){return !have.includes(x)}),score=required.length?Math.round(55+40*(have.length/required.length)):68,verdict=score>=78?'Yes — you are a strong match.':score>=62?'Yes — apply, but address the gaps in your application.':'Build one or two missing skills before making this a priority application.',root=document.getElementById('job-results');root.classList.add('show');root.innerHTML='<div class="results-head"><span class="kicker">Your job match</span><h2>'+title+'</h2></div><article class="result-card"><div class="result-rank">'+score+'%</div><div><h3>Should you apply?</h3><p><strong>'+verdict+'</strong></p><h3>You have</h3><div class="skill-row">'+(have.length?have:['transferable experience']).map(function(x){return '<span class="skill-chip">'+x+' ✓</span>'}).join('')+'</div><h3>You’re missing</h3><p>'+(missing.length?missing.join(' · '):'No obvious keyword gaps found. Check experience level and required evidence carefully.')+'</p><p><strong>Why:</strong> The score compares explicit skill requirements in this description with your saved profile. It is guidance, not a hiring prediction.</p></div></article>';root.scrollIntoView({behavior:'smooth'})});
</script></body></html>
